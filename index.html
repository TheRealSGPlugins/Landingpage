<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Donations</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-1: #050816;
      --bg-2: #090d1f;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-soft: #b8c4dd;
      --cyan: #48d7ff;
      --mint: #5dffca;
      --purple: #9a6bff;
      --pink: #ff62d4;
      --yellow: #ffd36b;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(circle at top, #0d1330 0%, #060914 45%, #03050d 100%);
      overflow-x: hidden;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    /* BACKGROUND */
    .space-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(72, 215, 255, 0.12), transparent 20%),
        radial-gradient(circle at 80% 15%, rgba(154, 107, 255, 0.12), transparent 24%),
        radial-gradient(circle at 60% 80%, rgba(93, 255, 202, 0.08), transparent 20%),
        linear-gradient(180deg, #060914 0%, #04070f 40%, #02040b 100%);
    }

    .nebula {
      position: absolute;
      border-radius: 999px;
      filter: blur(60px);
      opacity: 0.65;
      animation: pulseDrift 8s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    .nebula.one {
      width: 320px;
      height: 320px;
      left: 6%;
      top: 8%;
      background: rgba(72, 215, 255, 0.18);
      animation-delay: 0s;
    }

    .nebula.two {
      width: 360px;
      height: 360px;
      right: 8%;
      top: 12%;
      background: rgba(154, 107, 255, 0.18);
      animation-delay: 2s;
    }

    .nebula.three {
      width: 280px;
      height: 280px;
      left: 18%;
      bottom: 8%;
      background: rgba(255, 98, 212, 0.14);
      animation-delay: 4s;
    }

    .nebula.four {
      width: 300px;
      height: 300px;
      right: 16%;
      bottom: 6%;
      background: rgba(93, 255, 202, 0.14);
      animation-delay: 1s;
    }

    @keyframes pulseDrift {
      0% {
        transform: scale(1) translate(0, 0);
        opacity: 0.45;
      }
      50% {
        transform: scale(1.15) translate(8px, -10px);
        opacity: 0.82;
      }
      100% {
        transform: scale(1) translate(0, 0);
        opacity: 0.45;
      }
    }

    .stars,
    .stars2 {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 0 6px rgba(255, 255, 255, 0.95),
        0 0 12px rgba(72, 215, 255, 0.45);
      animation: twinkle ease-in-out infinite;
      opacity: 0.3;
    }

    .star.small {
      width: 2px;
      height: 2px;
    }

    .star.medium {
      width: 3px;
      height: 3px;
    }

    .star.big {
      width: 4px;
      height: 4px;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.15;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.35);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 980px;
    }

    .hero {
      text-align: center;
      padding: 38px 24px;
      margin-bottom: 22px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(18px);
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.35),
        inset 0 0 50px rgba(255, 255, 255, 0.02);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(72, 215, 255, 0.25);
      background: rgba(72, 215, 255, 0.08);
      color: #9cecff;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1;
      letter-spacing: -1.5px;
      text-shadow: 0 0 25px rgba(72, 215, 255, 0.12);
    }

    .sub {
      max-width: 650px;
      margin: 18px auto 0;
      color: var(--text-soft);
      line-height: 1.6;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .coin {
      position: relative;
      overflow: hidden;
      min-height: 185px;
      border-radius: 24px;
      padding: 22px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.03));
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.30),
        inset 0 0 20px rgba(255, 255, 255, 0.015);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      backdrop-filter: blur(14px);
    }

    .coin::before {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      right: -55px;
      top: -55px;
      border-radius: 999px;
      background: var(--glow);
      opacity: 0.20;
      filter: blur(12px);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .coin:hover {
      transform: translateY(-6px);
      border-color: rgba(72, 215, 255, 0.45);
      box-shadow:
        0 22px 60px rgba(0, 0, 0, 0.34),
        0 0 35px rgba(72, 215, 255, 0.10);
    }

    .coin:hover::before {
      transform: scale(1.15);
      opacity: 0.35;
    }

    .ticker {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 17px;
      color: #07101c;
      background: var(--accent);
      box-shadow: 0 0 28px var(--shadow);
      margin-bottom: 18px;
    }

    .coin-name {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .network {
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.4;
    }

    .tap {
      margin-top: 22px;
      font-size: 13px;
      color: #9cecff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: #8190ab;
      font-size: 13px;
      line-height: 1.5;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 6, 18, 0.78);
      backdrop-filter: blur(10px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 470px;
      border-radius: 30px;
      padding: 26px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background:
        radial-gradient(circle at top, rgba(72, 215, 255, 0.10), transparent 38%),
        linear-gradient(145deg, rgba(15, 24, 42, 0.98), rgba(7, 11, 24, 0.98));
      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(72, 215, 255, 0.08);
      backdrop-filter: blur(12px);
    }

    #modalTitle {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .modal-network {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(72, 215, 255, 0.09);
      border: 1px solid rgba(72, 215, 255, 0.18);
      color: #9cecff;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    #qr {
      width: fit-content;
      min-height: 258px;
      margin: 10px auto 18px;
      padding: 14px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: white;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    #qr canvas,
    #qr img {
      display: block;
      width: 230px;
      height: 230px;
    }

    .address {
      word-break: break-all;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.11);
      padding: 14px;
      border-radius: 16px;
      font-size: 14px;
      color: #dce8ff;
      line-height: 1.45;
    }

    .warning {
      color: var(--yellow);
      font-size: 13px;
      line-height: 1.45;
      margin: 14px 0 18px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      cursor: pointer;
      font-weight: 800;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .copy {
      background: linear-gradient(135deg, #48d7ff, #5dffca);
      color: #06101a;
      box-shadow: 0 0 24px rgba(72, 215, 255, 0.28);
    }

    .close {
      background: rgba(255, 255, 255, 0.09);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(30px);
      opacity: 0;
      z-index: 50;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(8, 13, 27, 0.96);
      color: white;
      border: 1px solid rgba(72, 215, 255, 0.25);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.38);
      transition: 0.22s ease;
      font-weight: 700;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 560px) {
      body {
        padding: 16px;
      }

      .hero {
        padding: 28px 18px;
      }

      .coin {
        min-height: 160px;
      }

      .modal-box {
        padding: 22px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="space-bg">
    <div class="nebula one"></div>
    <div class="nebula two"></div>
    <div class="nebula three"></div>
    <div class="nebula four"></div>
    <div class="stars" id="stars"></div>
  </div>

  <main class="container">
    <section class="hero">
      <div class="badge">Secure Crypto Donations</div>
      <h1>Support the Stream</h1>
      <p class="sub">
        Choose a coin below to reveal the wallet address and QR code.
        Always double-check the coin and network before sending.
      </p>
    </section>

    <section class="grid" id="coinGrid"></section>

    <p class="footer-note">
      Crypto transactions are final. Send only the listed coin on the listed network.
    </p>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2 id="modalTitle"></h2>
      <div class="modal-network" id="modalNetwork"></div>

      <div id="qr"></div>

      <div class="address" id="addressText"></div>
      <p class="warning" id="warningText"></p>

      <div class="actions">
        <button class="copy" id="copyButton" type="button">Copy Address</button>
        <button class="close" id="closeButton" type="button">Close</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Address copied.</div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const donations = [
        {
          name: "Bitcoin",
          short: "BTC",
          network: "Bitcoin Network",
          address: "PUT_YOUR_BTC_ADDRESS_HERE",
          warning: "Send BTC only on the Bitcoin network.",
          accent: "#f7b955",
          shadow: "rgba(247, 185, 85, 0.35)",
          glow: "rgba(247, 185, 85, 0.9)"
        },
        {
          name: "Ethereum",
          short: "ETH",
          network: "Ethereum / ERC-20",
          address: "PUT_YOUR_ETH_ADDRESS_HERE",
          warning: "Send ETH or ERC-20 tokens only to this address.",
          accent: "#8aa4ff",
          shadow: "rgba(138, 164, 255, 0.35)",
          glow: "rgba(138, 164, 255, 0.9)"
        },
        {
          name: "Solana",
          short: "SOL",
          network: "Solana Network",
          address: "PUT_YOUR_SOL_ADDRESS_HERE",
          warning: "Send SOL only on the Solana network.",
          accent: "#5dffca",
          shadow: "rgba(93, 255, 202, 0.35)",
          glow: "rgba(93, 255, 202, 0.9)"
        },
        {
          name: "Litecoin",
          short: "LTC",
          network: "Litecoin Network",
          address: "PUT_YOUR_LTC_ADDRESS_HERE",
          warning: "Send LTC only on the Litecoin network.",
          accent: "#c8d4ef",
          shadow: "rgba(200, 212, 239, 0.28)",
          glow: "rgba(200, 212, 239, 0.75)"
        }
      ];

      let currentAddress = "";

      const grid = document.getElementById("coinGrid");
      const modal = document.getElementById("modal");
      const toast = document.getElementById("toast");
      const closeButton = document.getElementById("closeButton");
      const copyButton = document.getElementById("copyButton");
      const starsContainer = document.getElementById("stars");

      function createStars() {
        const totalStars = 85;

        for (let i = 0; i < totalStars; i++) {
          const star = document.createElement("div");
          const sizeTypeRand = Math.random();

          star.classList.add("star");

          if (sizeTypeRand < 0.6) {
            star.classList.add("small");
          } else if (sizeTypeRand < 0.9) {
            star.classList.add("medium");
          } else {
            star.classList.add("big");
          }

          star.style.left = Math.random() * 100 + "%";
          star.style.top = Math.random() * 100 + "%";
          star.style.animationDuration = (2 + Math.random() * 4) + "s";
          star.style.animationDelay = (Math.random() * 4) + "s";

          starsContainer.appendChild(star);
        }
      }

      createStars();

      donations.forEach(function (coin) {
        const div = document.createElement("div");
        div.className = "coin";
        div.style.setProperty("--accent", coin.accent);
        div.style.setProperty("--shadow", coin.shadow);
        div.style.setProperty("--glow", coin.glow);

        div.innerHTML = `
          <div class="ticker">${coin.short}</div>
          <div class="coin-name">${coin.name}</div>
          <div class="network">${coin.network}</div>
          <div class="tap">View QR Code</div>
        `;

        div.addEventListener("click", function () {
          openModal(coin);
        });

        grid.appendChild(div);
      });

      function openModal(coin) {
        currentAddress = coin.address;

        document.getElementById("modalTitle").textContent = coin.name + " Donation";
        document.getElementById("modalNetwork").textContent = coin.network;
        document.getElementById("addressText").textContent = coin.address;
        document.getElementById("warningText").textContent = coin.warning;

        modal.classList.add("show");
        generateQR(coin.address);
      }

      function generateQR(address) {
        const qrBox = document.getElementById("qr");
        qrBox.innerHTML = "Loading QR...";

        if (window.QRCode && typeof QRCode.toCanvas === "function") {
          qrBox.innerHTML = "";

          QRCode.toCanvas(address, {
            width: 230,
            margin: 1
          }, function (err, canvas) {
            if (err) {
              showFallbackQR(address);
              return;
            }

            qrBox.innerHTML = "";
            qrBox.appendChild(canvas);
          });
        } else {
          showFallbackQR(address);
        }
      }

      function showFallbackQR(address) {
        const qrBox = document.getElementById("qr");
        qrBox.innerHTML = "";

        const img = document.createElement("img");
        img.src = "https://api.qrserver.com/v1/create-qr-code/?size=230x230&data=" + encodeURIComponent(address);
        img.alt = "Donation QR Code";
        img.width = 230;
        img.height = 230;

        qrBox.appendChild(img);
      }

      function closeModal() {
        modal.classList.remove("show");
      }

      async function copyAddress() {
        try {
          await navigator.clipboard.writeText(currentAddress);
          showToast("Address copied.");
        } catch (err) {
          const temp = document.createElement("textarea");
          temp.value = currentAddress;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand("copy");
          document.body.removeChild(temp);
          showToast("Address copied.");
        }
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");

        setTimeout(function () {
          toast.classList.remove("show");
        }, 1800);
      }

      closeButton.addEventListener("click", closeModal);
      copyButton.addEventListener("click", copyAddress);

      modal.addEventListener("click", function (event) {
        if (event.target === modal) {
          closeModal();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeModal();
        }
      });
    });
  </script>
</body>
</html>
